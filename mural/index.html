/* Tema de um mural: "tema:<id>" ou uma cor hexadecimal (murais antigos) */
function temaDe(cor){
  const t = TEMAS.find(x => 'tema:' + x.id === cor);
  if (t) return t;
  const c = /^#[0-9a-f]{6}$/i.test(cor || '') ? cor : '#2f63d6';
  return {id:'cor', nome:'Cor lisa', grupo:'Cores', claro:false, fundo:c, quadro:c + '22'};
}

/* ---------- utilidades ---------- */
function el(tag, attrs = {}, ...filhos){
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)){
    if (v === false || v == null) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'html') n.innerHTML = v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const f of filhos.flat()){
    if (f == null || f === false) continue;
    n.append(f.nodeType ? f : document.createTextNode(String(f)));
  }
  return n;
}

const AVISOS = [/Código/, /tentativas/, /Muitas publicações/, /endereço precisa/, /conteúdo deve/, /legenda pode/, /Informe seu nome/, /Tipo de publicação/, /Mural não encontrado/, /só para leitura/, /Permissão inválida/, /comentário deve/, /Reação inválida/, /Publicação não encontrada/, /tipo de arquivo não é aceito/, /muito grande/, /Não foi possível enviar o arquivo/, /Grave um áudio/, /Escolha um arquivo/];
function erroAmigavel(err){
  const m = (err && err.message) || '';
  if (/Sem permissão/.test(m)) return 'Você não tem permissão para isso neste navegador.';
  if (AVISOS.some(r => r.test(m))) return m;
  if (/Failed to fetch|network/i.test(m)) return 'Não foi possível falar com o servidor agora. Tente de novo em instantes.';
  return 'Algo deu errado. Tente novamente.';
}

/* ---------- arquivos e vídeos ---------- */
function comprimirImagem(file){
  return new Promise((resolve) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const esc = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * esc); c.height = Math.round(img.height * esc);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); resolve(b && b.size < file.size ? b : file); }, 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
async function enviarArquivo(arquivo, tipo, muralId){
  const base = (arquivo.type || '').split(';')[0];
  if (!MIME_OK[tipo].includes(base)) throw new Error('Este tipo de arquivo não é aceito nesta opção.');
  let corpo = arquivo;
  if (tipo === 'imagem' && base !== 'image/gif') corpo = await comprimirImagem(arquivo);
  const tipoFinal = (corpo.type || base).split(';')[0];
  if (corpo.size > LIMITE_MB[tipo] * 1048576) throw new Error('O arquivo é muito grande. O limite é de ' + LIMITE_MB[tipo] + ' MB.');
  const caminho = muralId + '/' + idAleatorio() + '.' + (EXTENSAO[tipoFinal] || 'bin');
  const { error } = await sb.storage.from(BUCKET).upload(caminho, corpo, {contentType: tipoFinal, cacheControl: '31536000'});
  if (error) throw new Error('Não foi possível enviar o arquivo. Tente de novo.');
  return sb.storage.from(BUCKET).getPublicUrl(caminho).data.publicUrl;
}
function videoEmbed(url){
  let u; try { u = new URL(url); } catch(e){ return null; }
  const h = u.hostname.replace(/^www\./, '').replace(/^m\./, '');
  if (h === 'youtube.com'){
    let id = null;
    if (u.pathname === '/watch') id = u.searchParams.get('v');
    else { const m = u.pathname.match(/^\/(?:embed|shorts)\/([\w-]+)/); if (m) id = m[1]; }
    return id && /^[\w-]{6,20}$/.test(id) ? 'https://www.youtube-nocookie.com/embed/' + id : null;
  }
  if (h === 'youtu.be'){
    const m = u.pathname.match(/^\/([\w-]{6,20})/);
    return m ? 'https://www.youtube-nocookie.com/embed/' + m[1] : null;
  }
  if (h === 'vimeo.com'){
    const m = u.pathname.match(/^\/(\d{6,12})/);
    return m ? 'https://player.vimeo.com/video/' + m[1] : null;
  }
  return null;
}

function formMural(valores, aoSalvar, comAcesso = false){
  let cor = valores.cor || TEMA_PADRAO;

  const botoesLayout = LAYOUTS.map(([v, nome]) => el('button', {type:'button', 'aria-pressed': String(v === layout), onclick(){
    layout = v; botoesLayout.forEach((b, i) => b.setAttribute('aria-pressed', String(LAYOUTS[i][0] === v)));
  }}, nome));
  const botoesPerm = PERMISSOES.map(([v, nome]) => el('button', {type:'button', 'aria-pressed': String(v === permissao), onclick(){
    permissao = v; botoesPerm.forEach((b, i) => b.setAttribute('aria-pressed', String(PERMISSOES[i][0] === v)));
  }}, nome));

  ] : [];
  const form = el('form', {class:'painel', onsubmit: async (e) => {
    e.preventDefault();
    feedback.textContent = '';

    if (!t){ feedback.textContent = 'Dê um título para o mural.'; titulo.focus(); return; }
    const botao = form.querySelector('[type=submit]'); botao.disabled = true;
    try { await aoSalvar({titulo:t, descricao:desc.value.trim(), cor, layout, permissao, moderar: caixaMod.checked}); }
    catch(err){ feedback.textContent = erroAmigavel(err); botao.disabled = false; }
  }},

      el('button', {type:'button', class:'btn sec', onclick: () => fecharModal()}, 'Cancelar'),
      el('button', {type:'submit', class:'btn'}, 'Salvar')));
  return form;
}

    if (tipo === 'texto'){
      conteudo = areaTexto.value.trim();
      if (!conteudo){ erroForm('Escreva algo antes de publicar.'); areaTexto.focus(); return; }
    } else if (tipo === 'link'){
      if (!link){ erroForm('Cole o endereço do site.'); urlIn.focus(); return; }
      if (!urlOk(link)){ erroForm('O endereço precisa começar com https:// (ou http://).'); urlIn.focus(); return; }
      conteudo = link;
    } else if (!arq){
      if ((tipo === 'imagem' || tipo === 'video') && link){
        if (!urlOk(link)){ erroForm('O endereço precisa começar com https:// (ou http://).'); urlIn.focus(); return; }
        if (tipo === 'video' && !videoEmbed(link)){ erroForm('Para vídeo por link, use um endereço do YouTube ou do Vimeo. Ou envie o arquivo.'); urlIn.focus(); return; }
        conteudo = link;
      } else {
        erroForm(tipo === 'audio' ? 'Grave um áudio ou escolha um arquivo.' : 'Escolha um arquivo para publicar.'); return;
      }
    }
    gravarNome(autor);
    botaoPub.disabled = true;
    try {
      if (arq){
        feedback.textContent = 'Enviando…';
        nome = arquivoEscolhido ? arquivoEscolhido.name : 'gravacao-' + Date.now() + '.webm';
        conteudo = await enviarArquivo(arq, tipo, id);
        feedback.textContent = '';
      }
      const { data: r, error: e7 } = await sb.rpc('mural_publicar', {
        p_mural: id, p_codigo: dono ? null : codigo, p_token: token,
        p_tipo: tipo, p_conteudo: conteudo, p_legenda: tipo === 'texto' ? '' : legenda.value.trim(), p_autor: autor, p_nome: nome, p_titulo: campoTitulo.value.trim(), p_eu: EU
      });
      if (e7) throw e7;
      if (r && r.erro) throw new Error(r.erro);
      areaTexto.value = ''; urlIn.value = ''; legenda.value = ''; campoTitulo.value = ''; montarZona();
      toast(r && r.aprovada === false ? 'Enviado! A professora vai aprovar a sua publicação. ⏳' : 'Publicado! 🎉');
      await atualizarFeed(true);
    } catch(err){
      feedback.className = 'fb erro'; feedback.textContent = err.message && AVISOS.some(x => x.test(err.message)) ? err.message : erroAmigavel(err);
    } finally {
      botaoPub.disabled = false;
    }
  }},
    el('div', {class:'seg tres', role:'group', 'aria-label':'Tipo de publicação'}, botoesTipo),
    el('label', {for:'autor'}, 'Seu nome'), campoNome,
    el('label', {for:'tit-pub'}, 'Título (acima da publicação)'), campoTitulo,
    el('label', {}, 'Conteúdo'), zona, contadorEl,
    descBox,
    feedback,
    el('div', {class:'acoes', style:'justify-content:flex-end;margin:12px 0 0'}, botaoPub));
  montarZona();
  const avisoLeitura = el('div', {class:'aviso naoimprimir', style:'margin-bottom:18px'}, '👀 Este mural está aberto só para leitura. Quem criou o mural pode liberar a publicação.');

  /* ----- publicações ----- */
  const feed = el('div', {class:'feed ' + layout, 'aria-label':'Publicações'});
  const areaPend = el('section', {class:'painel naoimprimir', 'aria-label':'Aguardando aprovação'});

  function desenharPendentes(){
    areaPend.replaceChildren();
    if (!dono || !pendentes.length){ areaPend.style.display = 'none'; return; }
    areaPend.style.display = '';
    areaPend.append(
      el('h2', {style:'font-size:1.2rem'}, '⏳ Aguardando sua aprovação (' + pendentes.length + ')'),
      el('div', {class:'feed grade', style:'margin-top:12px'}, pendentes.map(p => cartao(p, true))));
  }
  function desenharFeed(){
    feed.className = 'feed ' + layout;
    const itens = (layout === 'linha') ? [...publicacoes].reverse() : publicacoes;
    feed.replaceChildren(...(itens.length ? itens.map(p => cartao(p, false)) : [el('div', {class:'vazio', style:'grid-column:1/-1'}, el('div', {class:'ico'}, '✨'), el('h2', {}, 'Crie a primeira publicação'), el('p', {}, canPublicar ? 'Use a coluna ao lado para começar o mural.' : 'Ainda não há publicações neste mural.'))]));
  }
  function desenharTudo(){ desenharPendentes(); desenharFeed(); }

  async function aprovar(p){
    const { error: e8 } = await sb.rpc('mural_aprovar', {p_publicacao: p.id, p_token: token});
    if (e8){ toast(erroAmigavel(e8)); return; }
    toast('Publicação aprovada ✅');
    await atualizarFeed(true);
  }
  async function apagar(p){
    if (!confirm('Excluir esta publicação?')) return;
    const { error: e9 } = await sb.rpc('mural_excluir_publicacao', {p_publicacao: p.id, p_token: token});
    if (e9){ toast(erroAmigavel(e9)); return; }
    publicacoes = publicacoes.filter(x => x.id !== p.id);
    pendentes = pendentes.filter(x => x.id !== p.id);
    desenharTudo(); toast('Publicação excluída.');
  }

  async function reagir(p, tipoR, botoes){
    const { data: r, error: e10 } = await sb.rpc('mural_reagir', {p_publicacao: p.id, p_codigo: dono ? null : codigo, p_token: token, p_tipo: tipoR, p_eu: EU});
    if (e10 || (r && r.erro)){ toast(e10 ? erroAmigavel(e10) : r.erro); return; }
    gravarReacao(p.id, tipoR, r.marcado);
    botoes.forEach(({tipo: t, botao}) => {
      const n = r.reacoes[t] || 0;
      botao.textContent = REACOES.find(x => x[0] === t)[1] + ' ' + n;
      botao.setAttribute('aria-pressed', String(t === tipoR ? r.marcado : reacoesMarcadas(p.id).includes(t)));
    });
  }

  /* Edição no próprio cartão: título, texto/endereço e descrição (a mídia enviada não muda) */
  function editarPub(p, corpoBox, corpoOriginal){
    const campoT = el('input', {maxlength:'120', value: p.titulo || '', placeholder:'Título (opcional)', 'aria-label':'Título'});
    const ehTexto = p.tipo === 'texto', ehLink = p.tipo === 'link';
    const campoC = ehTexto ? el('textarea', {maxlength:'2000', 'aria-label':'Texto'}, p.conteudo) : ehLink ? el('input', {type:'url', value: p.conteudo, 'aria-label':'Endereço do site'}) : null;
    if (ehTexto) campoC.value = p.conteudo;
    const campoD = ehTexto ? null : el('textarea', {maxlength:'500', placeholder:'Descrição (opcional)', 'aria-label':'Descrição'}, p.legenda || '');
    if (campoD) campoD.value = p.legenda || '';
    const aviso = el('div', {class:'fb', role:'status'});
    const salvar = el('button', {type:'submit', class:'btn peq'}, '💾 Salvar');
    const form = el('form', {class:'editando naoimprimir', novalidate:true, onsubmit: async (e) => {
      e.preventDefault(); aviso.className = 'fb'; aviso.textContent = '';
      const cont = campoC ? campoC.value.trim() : p.conteudo;
      if (campoC && !cont){ aviso.className = 'fb erro'; aviso.textContent = 'O conteúdo não pode ficar vazio.'; return; }
      if (ehLink && !urlOk(cont)){ aviso.className = 'fb erro'; aviso.textContent = 'O endereço precisa começar com https:// (ou http://).'; return; }
      salvar.disabled = true;
      const { data: r, error: eE } = await sb.rpc('mural_editar_publicacao', {p_publicacao: p.id, p_codigo: dono ? null : codigo, p_token: token, p_eu: EU, p_titulo: campoT.value.trim(), p_conteudo: cont, p_legenda: campoD ? campoD.value.trim() : ''});
      salvar.disabled = false;
      if (eE || (r && r.erro)){ aviso.className = 'fb erro'; aviso.textContent = eE ? erroAmigavel(eE) : r.erro; return; }
      toast(r && r.aprovada === false ? 'Salvo! A professora vai aprovar de novo. ⏳' : 'Publicação atualizada ✅');
      Object.assign(p, {titulo: campoT.value.trim(), conteudo: cont, legenda: campoD ? campoD.value.trim() : ''});
      ultimaChave = ''; desenharTudo();
      await atualizarFeed(true);
    }},
      el('label', {}, 'Título'), campoT,
      campoC ? el('label', {}, ehTexto ? 'Texto' : 'Endereço do site') : null, campoC,
      campoD ? el('label', {}, 'Descrição') : null, campoD,
      aviso,
      el('div', {class:'acoes', style:'margin:8px 0 0'}, salvar,
        el('button', {type:'button', class:'btn sec peq', onclick: () => corpoBox.replaceChildren(...corpoOriginal)}, 'Cancelar')));
    corpoBox.replaceChildren(form); campoT.focus();
  }

  function cartao(p, pendente){
    const corpo = conteudoPub(p);
    const tipoNome = (TIPOS.find(t => t[0] === p.tipo) || ['', ''])[1].replace(/^\S+\s/, '');
    const meu = dono || (!!p.autor_eu && p.autor_eu === EU && canPublicar);
    const acoesDono = dono && pendente ? el('div', {class:'acoes naoimprimir', style:'margin:4px 0 0'},
      el('button', {class:'btn peq', onclick: () => aprovar(p)}, '✅ Aprovar')) : null;
    const corpoBox = el('div', {class:'corpo', style:'display:flex;flex-direction:column;gap:8px'}, corpo);
    const cantoBtns = meu ? el('div', {class:'canto naoimprimir'},
      el('button', {type:'button', class:'ic', title:'Editar publicação', 'aria-label':'Editar publicação', onclick: () => editarPub(p, corpoBox, corpo)}, '✏️'),
      dono ? el('button', {type:'button', class:'ic', title:'Excluir publicação', 'aria-label':'Excluir publicação', onclick: () => apagar(p)}, '🗑️') : null) : null;

    let interacao = null;
    if (!pendente){
      const marcadas = reacoesMarcadas(p.id);
      const botoes = REACOES.map(([t, nome]) => {
        const n = (p.reacoes && p.reacoes[t]) || 0;
        const botao = el('button', {type:'button', class:'btn sec peq', 'aria-pressed': String(marcadas.includes(t)), disabled: !canPublicar, onclick: () => reagir(p, t, botoes)}, nome + ' ' + n);
        return {tipo: t, botao};
      });
      const linhaReacoes = el('div', {class:'reagir naoimprimir'}, botoes.map(b => b.botao));
      const listaCom = el('ul', {class:'comentarios', 'aria-label':'Comentários'},
        (p.comentarios || []).map(c => linhaComentario(c)));
      const campoCom = el('input', {maxlength:'300', placeholder:'Escreva um comentário…', 'aria-label':'Comentário'});
      const formCom = canPublicar ? el('form', {class:'comentar naoimprimir', onsubmit: async (e) => {
        e.preventDefault();
        const texto = campoCom.value.trim();
        if (!texto) return;
        const { data: c, error: e11 } = await sb.rpc('mural_comentar', {p_publicacao: p.id, p_codigo: dono ? null : codigo, p_token: token, p_autor: campoNome.value.trim() || 'Anônimo', p_texto: texto});
        if (e11 || (c && c.erro)){ toast(e11 ? erroAmigavel(e11) : c.erro); return; }
        campoCom.value = '';
        p.comentarios = [...(p.comentarios || []), c];
        listaCom.append(linhaComentario(c));
      }}, campoCom, el('button', {type:'submit', class:'btn sec peq'}, 'Comentar')) : null;
      interacao = el('div', {class:'interacao'}, linhaReacoes, listaCom, formCom);
    }

    return el('article', {class: 'pub tipo-' + p.tipo + (pendente ? ' pendente' : ''), 'aria-label': tipoNome + ' de ' + p.autor},
      pendente ? el('span', {class:'tipo'}, '⏳ Aguardando aprovação') : null,
      corpoBox,
      cantoBtns,
      el('div', {class:'rodape'}, el('span', {}, '👤 ' + p.autor), el('span', {}, data(p.criado_em))),
      interacao,
      acoesDono);
  }

  function linhaComentario(c){
    return el('li', {class:'comentario'},
      el('b', {}, c.autor + ': '), c.texto,
      dono ? el('button', {type:'button', class:'btn perigo peq naoimprimir', 'aria-label':'Excluir comentário', style:'margin-left:6px', onclick: async (e) => {
        if (!confirm('Excluir este comentário?')) return;
        const { error: e12 } = await sb.rpc('mural_excluir_comentario', {p_comentario: c.id, p_token: token});
        if (e12){ toast(erroAmigavel(e12)); return; }
        e.target.closest('li').remove();
      }}, '🗑️') : null);
  }

  function conteudoPub(p){
    const corpo = [];
    if (p.titulo) corpo.push(el('h3', {class:'pub-titulo'}, p.titulo));
    if (p.tipo === 'texto'){
      corpo.push(el('div', {class:'texto'}, p.conteudo));
    } else if (p.tipo === 'imagem'){
      const img = el('img', {src: p.conteudo, alt: p.legenda || 'Imagem enviada por ' + p.autor, loading:'lazy', referrerpolicy:'no-referrer', onclick(){ abrirLupa(p.conteudo, p.legenda); }});
      img.onerror = () => { img.replaceWith(el('div', {class:'aviso'}, 'Não foi possível carregar esta imagem. Confira o endereço.')); };
      corpo.push(img);
    } else if (p.tipo === 'audio'){
      corpo.push(el('audio', {controls:true, preload:'metadata', src: p.conteudo, style:'width:100%'}));
    } else if (p.tipo === 'video'){
      const emb = videoEmbed(p.conteudo);
      corpo.push(emb
        ? el('iframe', {src: emb, title:'Vídeo de ' + p.autor, allow:'accelerometer; encrypted-media; picture-in-picture', allowfullscreen:true, style:'width:100%;aspect-ratio:16/9;border:0;border-radius:12px'})
        : el('video', {controls:true, playsinline:true, preload:'metadata', src: p.conteudo, style:'width:100%;border-radius:12px'}));
    } else if (p.tipo === 'arquivo'){
      corpo.push(el('a', {class:'lk', href: p.conteudo, target:'_blank', rel:'noopener noreferrer', download: p.nome_arquivo || ''},
        el('b', {}, '📄 ' + (p.nome_arquivo || 'Arquivo para baixar')), 'Toque para abrir ou baixar'));
    } else if (p.tipo === 'link'){
      let host = p.conteudo; try { host = new URL(p.conteudo).hostname; } catch(e){}
      /* Prévia do site: miniatura do YouTube ou imagem da tela da página */
      const yt = p.conteudo.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/);
      const fonteImg = yt ? 'https://i.ytimg.com/vi/' + yt[1] + '/hqdefault.jpg'
        : 'https://image.thum.io/get/width/700/crop/440/noanimate/' + p.conteudo;
      const previa = el('img', {class:'previa', src: fonteImg, alt:'Prévia do site ' + host, loading:'lazy', referrerpolicy:'no-referrer'});
      previa.onerror = () => { previa.remove(); };
      corpo.push(el('a', {class:'lk lk-previa', href: p.conteudo, target:'_blank', rel:'noopener noreferrer', 'aria-label':'Abrir o site ' + host},
        previa, el('b', {}, '🔗 ' + host), el('span', {class:'url'}, p.conteudo)));
    }
    if (p.legenda) corpo.push(el('div', {class:'legenda'}, p.legenda));
    return corpo;
  }

  let ultimaChave = '';
  async function atualizarFeed(forcar){
    const { data: d2, error: e13 } = await sb.rpc('mural_ler', {p_mural: id, p_codigo: dono ? null : codigo, p_token: token});
    if (e13) return;
    if (d2 && d2.erro){ pararAtualizacao(); pedirCodigo(id, 'O código deste mural mudou. Digite o novo código.'); return; }
    publicacoes = d2.publicacoes || [];
    pendentes = d2.pendentes || [];
    const chave = JSON.stringify([publicacoes.map(p => [p.id, p.reacoes, (p.comentarios||[]).length, p.titulo, p.conteudo, p.legenda]), pendentes.map(p => p.id)]);
    const editando = !forcar && (
      [...feed.querySelectorAll('.comentar input'), ...areaPend.querySelectorAll('.comentar input')].some(i => i.value.trim()) ||
      feed.contains(document.activeElement) || areaPend.contains(document.activeElement) || botaoPub.disabled || !!document.querySelector('.editando'));
    if (editando || chave === ultimaChave) return;
    ultimaChave = chave;
    desenharTudo();
  }

  function abrirApresentacao(){
    const lista = [...publicacoes].reverse();
    if (!lista.length){ toast('Ainda não há publicações para apresentar.'); return; }
    let i = 0, pausado = false, tempo = null;
    const palco = el('div', {class:'palco', role:'dialog', 'aria-label':'Apresentação do mural'});
    const txtContador = el('span', {class:'palco-cont'});
    function mostrar(){
      const p = lista[i];
      const tipoNome = (TIPOS.find(t => t[0] === p.tipo) || ['', ''])[1].replace(/^\S+\s/, '');
      palco.querySelector('.palco-card')?.remove();
      palco.prepend(el('article', {class:'palco-card'},
        el('div', {class:'corpo', style:'display:flex;flex-direction:column;gap:12px'}, conteudoPub(p)),
        el('div', {class:'rodape'}, el('span', {}, '👤 ' + p.autor))));
      txtContador.textContent = (i + 1) + ' de ' + lista.length;
    }
    function ciclo(){ clearInterval(tempo); if (!pausado) tempo = setInterval(() => { i = (i + 1) % lista.length; mostrar(); }, 8000); }
    const btnPausa = el('button', {type:'button', class:'btn sec peq', onclick(){ pausado = !pausado; btnPausa.textContent = pausado ? '▶ Continuar' : '⏸ Pausar'; ciclo(); }}, '⏸ Pausar');
    function fechar(){
      clearInterval(tempo); document.removeEventListener('keydown', teclas); palco.remove();
      if (document.fullscreenElement){ document.exitFullscreen().catch(() => {}); }
    }
    function teclas(e){
      if (e.key === 'ArrowRight'){ i = (i + 1) % lista.length; mostrar(); ciclo(); }
      else if (e.key === 'ArrowLeft'){ i = (i - 1 + lista.length) % lista.length; mostrar(); ciclo(); }
      else if (e.key === ' '){ e.preventDefault(); btnPausa.click(); }
      else if (e.key === 'Escape'){ fechar(); }
    }
    palco.append(
      el('div', {class:'palco-barra naoimprimir'},
        el('button', {type:'button', class:'btn sec peq', 'aria-label':'Anterior', onclick(){ i = (i - 1 + lista.length) % lista.length; mostrar(); ciclo(); }}, '⏮'),
        btnPausa,
        el('button', {type:'button', class:'btn sec peq', 'aria-label':'Próxima', onclick(){ i = (i + 1) % lista.length; mostrar(); ciclo(); }}, '⏭'),
        txtContador,
        el('button', {type:'button', class:'btn perigo peq', onclick: fechar}, '✕ Sair')));
    document.body.append(palco);
    document.addEventListener('keydown', teclas);
    try { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); } catch(e){}
    mostrar(); ciclo();
  }

  desenharTudo();
  const grpPublicar = grupo('✍️ Publicar no mural', [formPub], aberto);
  const lateral = el('aside', {class:'lateral naoimprimir', 'aria-label':'Opções do mural'},
    canPublicar ? grpPublicar : avisoLeitura,
    ...(dono ? [bloCodigo] : []),
    grupo('🧩 Layout do mural', [seletorLayout], aberto),
    grupo('📤 Compartilhar', [botoesCopiar], aberto),
    ...(dono ? [ferramentasDono] : []));
  /* Botão para recolher/abrir o painel (mais espaço para o mural) */
  const grade = el('div', {class:'mural-grid'});
  let painelFechado = false; try { painelFechado = localStorage.getItem('mural-painel') === '0'; } catch(e){}
  const botaoPainel = el('button', {type:'button', class:'btn sec peq alt-painel naoimprimir', 'aria-expanded': String(!painelFechado), onclick(){
    painelFechado = !painelFechado; grade.classList.toggle('sem-painel', painelFechado);
    botaoPainel.setAttribute('aria-expanded', String(!painelFechado)); botaoPainel.textContent = painelFechado ? '☰ Mostrar painel' : '« Recolher painel';
    try { localStorage.setItem('mural-painel', painelFechado ? '0' : '1'); } catch(e){}
  }}, painelFechado ? '☰ Mostrar painel' : '« Recolher painel');
  grade.classList.toggle('sem-painel', painelFechado);
  /* Botão flutuante "+" no celular: abre e leva ao formulário de publicar */
  const botaoFlutuante = canPublicar ? el('button', {type:'button', class:'fab naoimprimir', 'aria-label':'Nova publicação', onclick(){
    grpPublicar.open = true; grpPublicar.scrollIntoView({behavior:'smooth', block:'start'});
    setTimeout(() => { const c = document.getElementById('autor'); if (c) c.focus({preventScroll:true}); }, 350);
  }}, '＋') : null;
  const quadro = el('div', {class:'quadro-mural', style:'background:' + (tema.quadro || tema.fundo)}, areaPend, feed);
  app.classList.add('larga');
  app.replaceChildren(
    el('p', {class:'naoimprimir'}, el('a', {href:'#/', class:'ajuda'}, '← Todos os murais')),
    faixa,
    el('div', {class:'barra-painel naoimprimir'}, botaoPainel),
    grade);
  grade.append(lateral, quadro);
  if (botaoFlutuante) document.body.append(botaoFlutuante);
  timer = setInterval(() => { if (!document.hidden) atualizarFeed(false); }, 15000);
}
function abrirLupa(src, legenda){
  const l = el('div', {class:'lupa', onclick(){ l.remove(); }}, el('img', {src, alt: legenda || 'Imagem ampliada'}));
  document.body.append(l);
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape'){ fecharModal(); document.querySelectorAll('.lupa').forEach(x => x.remove()); } });

rota();
</script>
<script src="../estat.js" defer></script>
</body>
