<style>
  /* Mesmo visual do portal: caderno quadriculado e jogos como post-its coloridos */
  :root{
    --chao:#f3f6fb; --quadro:rgba(47,91,170,.11); --cartao:#ffffff; --cartao2:#f7f9fd;
    --tinta:#1d2b53; --tinta2:#55627f; --linha:#d9e1ee;
    --marca:#ffd23f; --marca-borda:#e0ad00; --coral:#d9442f; --verde:#12865f; --azul:#2f63d6;
    --sombra:0 1px 0 rgba(29,43,83,.06),0 10px 26px -14px rgba(29,43,83,.32);
    --n-amarelo:#ffe27a; --n-coral:#ffb4a6; --n-verde:#a6e4c6; --n-azul:#b9d4ff; --n-lilas:#d8c9ff; --n-laranja:#ffc88a;
    --tinta-nota:#1d2b53; --hero-bg:#1d2b53; --hero-bg2:#2f4aa0;
    --f-display:'Fredoka','Nunito',system-ui,sans-serif;
    --f-corpo:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background-color:var(--chao);background-image:linear-gradient(var(--quadro) 1px,transparent 1px),linear-gradient(90deg,var(--quadro) 1px,transparent 1px);background-size:26px 26px;color:var(--tinta);font-family:var(--f-corpo);font-size:16px;line-height:1.5;min-height:100vh}
  h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0}
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--azul);outline-offset:2px}
  .pular{position:absolute;left:-9999px;top:8px;background:var(--marca);color:#1d2b53;font-weight:800;padding:10px 16px;border-radius:12px;z-index:100;text-decoration:none}
  .pular:focus{left:8px}
  .marca-link{color:inherit;text-decoration:none}
  .marca-link:focus-visible{outline-color:var(--marca)}

  header.topo{background:linear-gradient(135deg,var(--hero-bg),var(--hero-bg2));color:#fff;padding:18px 16px 18px}
  header.topo .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  header.topo h1{font-size:clamp(1.4rem,3.4vw,2rem)}
  header.topo h1 span{color:var(--marca)}
  header.topo small{display:block;opacity:.8;font-weight:700;margin-top:2px}
  #usuario{display:flex;align-items:center;gap:10px;font-weight:700;flex-wrap:wrap}
  #usuario button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff;box-shadow:none}
  #usuario button.acesso{background:#ecfdf5;border-color:#6ee7b7;color:#065f46}
  #usuario button.acesso.perto{background:#fef3c7;border-color:#fbbf24;color:#92400e}
  #usuario button.acesso.fim{background:#fee2e2;border-color:#f87171;color:#991b1b}
  .ma-fundo{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px}
  .ma-caixa{background:var(--cartao);color:var(--tinta);border-radius:var(--r);max-width:400px;width:100%;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.35);text-align:center}
  .ma-dias{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1;margin:10px 0 2px}
  .ma-barra{height:10px;border-radius:99px;background:var(--linha);overflow:hidden;margin:12px 0 16px}
  .ma-barra i{display:block;height:100%;border-radius:99px}
  .ma-linha{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--linha);font-weight:600;text-align:left}

  main{max-width:1080px;margin:0 auto;padding:20px 16px}
  .card{background:var(--cartao);border:2px solid var(--linha);border-radius:var(--r);padding:20px;margin-bottom:20px;box-shadow:var(--sombra)}
  h2{font-size:1.45rem;margin-bottom:4px}
  .sub{color:var(--tinta2);margin:0 0 14px;font-weight:600}
  .passo{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-family:var(--f-display);font-size:1.15rem;font-weight:600}
  .passo b{width:30px;height:30px;border-radius:50%;background:var(--marca);border:2px solid var(--marca-borda);display:grid;place-items:center;font-size:.95rem;color:var(--tinta-nota)}
  label{display:block;font-weight:800;font-size:.92rem;margin:10px 0 5px}
  input,select{width:100%;padding:12px 13px;border:2px solid var(--linha);border-radius:12px;font-size:1rem;background:var(--cartao)}
  input:focus,select:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(47,99,214,.18)}

  button{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:2px solid var(--marca-borda);border-radius:12px;padding:10px 16px;font-weight:800;background:var(--marca);color:var(--tinta-nota);box-shadow:0 3px 0 var(--marca-borda);transition:transform .12s,box-shadow .12s}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(1px);box-shadow:0 1px 0 var(--marca-borda)}
  button.sec{background:var(--cartao);border-color:var(--linha);color:var(--tinta);box-shadow:none}
  button.perigo{background:transparent;border-color:var(--coral);color:var(--coral);box-shadow:none}
  button.peq{padding:7px 12px;font-size:.9rem;border-radius:10px}
  button.grande{padding:13px 22px;font-size:1.08rem}
  button:disabled{opacity:.55;cursor:default;transform:none}
  .linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}

  /* Cartões dos jogos (iguais aos do portal) */
  .grade-jogos{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}
  .cartao-jogo{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;background:var(--cartao);border:2px solid var(--linha);border-radius:var(--r);color:var(--tinta);box-shadow:none;transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
  .cartao-jogo:hover{transform:translateY(-4px) rotate(-.5deg);box-shadow:var(--sombra)}
  .cartao-jogo:active{transform:translateY(-1px);box-shadow:var(--sombra)}
  .cartao-jogo[aria-pressed="true"]{border-color:var(--azul);box-shadow:0 0 0 3px var(--azul),var(--sombra);transform:translateY(-3px)}
  .nota{background:var(--n,var(--n-amarelo));height:100px;display:grid;place-items:center;font-size:50px;position:relative;width:100%}
  .nota .tema{position:absolute;left:10px;top:9px;font-size:12px;font-weight:800;color:var(--tinta-nota);background:rgba(255,255,255,.65);padding:2px 9px;border-radius:99px;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-corpo)}
  .nota .emoji{transition:transform .25s;line-height:1}
  .cartao-jogo:hover .emoji{transform:scale(1.15) rotate(-6deg)}
  .marcado{position:absolute;right:9px;top:9px;width:30px;height:30px;border-radius:50%;background:var(--azul);color:#fff;display:none;place-items:center;font-size:16px;font-weight:900;font-family:var(--f-corpo);box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .cartao-jogo[aria-pressed="true"] .marcado{display:grid}
  .bncc{margin-top:6px;font-size:11.5px;font-weight:800;color:#3b4a8a;letter-spacing:.2px}
  .fav{position:absolute;right:8px;top:7px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;font-size:19px;line-height:1;cursor:pointer;color:#475569;border:1px solid #94a3b8;transition:transform .15s,background .15s}
  .atr-cartao{display:inline-block;margin-top:10px;align-self:flex-start;background:#fff;color:#1e293b;border:2px solid #1e293b;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800;line-height:1.2;cursor:pointer;box-shadow:0 2px 0 #1e293b;transition:transform .15s,background .15s}
  .atr-cartao:hover,.atr-cartao:focus-visible{background:#ffd23f;transform:translateY(-1px)}
  .fav:hover{transform:scale(1.15);background:#fff}
  .fav.on{color:#b45309;background:#fff;border-color:#f59e0b}
  .faixa-rapida{margin-bottom:6px}
  .faixa-rapida .grade-jogos{margin-bottom:8px}
  .corpo{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1;width:100%}
  .corpo h3{font-size:1.08rem}
  .corpo p{margin:0;color:var(--tinta2);font-size:.88rem;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .barra-escolha{position:sticky;bottom:10px;z-index:30;display:flex;align-items:center;gap:10px;margin:14px 0 0;padding:10px 12px;border-radius:14px;background:var(--cartao,#fff);border:2px solid var(--linha);box-shadow:0 10px 28px rgba(0,0,0,.18)}
  .barra-escolha[hidden]{display:none}
  .barra-escolha small{display:block;font-size:12px;opacity:.75}
  .barra-escolha b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .escolhido{display:flex;align-items:center;gap:12px;background:var(--cartao2);border:2px dashed var(--linha);border-radius:12px;padding:10px 14px;margin-top:4px;font-weight:700}
  .escolhido .mini{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:26px;background:var(--n,var(--n-amarelo));flex-shrink:0}

  /* Minhas atividades */
  .grade-ativ{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .ativ{display:flex;flex-direction:column;border:2px solid var(--linha);border-radius:var(--r);overflow:hidden;background:var(--cartao)}
  .ativ .topo-ativ{background:var(--n,var(--n-amarelo));display:flex;align-items:center;gap:12px;padding:12px 14px;color:var(--tinta-nota)}
  .ativ .topo-ativ .em{font-size:34px;line-height:1}
  .ativ .topo-ativ h3{font-size:1.12rem}
  .ativ .topo-ativ small{display:block;font-weight:800;opacity:.75}
  .ativ .meio{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;border:1.5px solid currentColor;color:var(--tinta2)}
  .tag.aberta{color:var(--verde)}
  .tag.enc{color:var(--coral)}
  .qr-caixa{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;border:2px dashed var(--linha);border-radius:12px;background:#fff}
  .qr-caixa canvas{width:100%;max-width:200px;height:auto;image-rendering:pixelated}
  .qr-caixa small{color:#444;font-weight:800;text-align:center}
  .link{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;background:var(--cartao2);border:1.5px solid var(--linha);border-radius:10px;padding:7px 10px;word-break:break-all}

  .msg{padding:10px 12px;border-radius:12px;margin:10px 0;font-size:.95rem;font-weight:700}
  .msg.erro{background:#fde3df;color:#8f2416}
  .msg.ok{background:#d9f3e7;color:#0b5c40}
  .msg.info{background:#e3ecff;color:#1f3f91}
  .tabs{display:flex;gap:8px;margin:10px 0 6px}
  .tabs button{flex:1;background:var(--cartao);border-color:var(--linha);box-shadow:none;color:var(--tinta)}
  .tabs button.ativo{background:var(--marca);border-color:var(--marca-borda);box-shadow:0 3px 0 var(--marca-borda)}
  .tabela-wrap{overflow-x:auto;border:2px solid var(--linha);border-radius:12px}
  table{border-collapse:collapse;width:100%;min-width:560px;background:var(--cartao)}
  th,td{padding:9px 10px;border-bottom:1px solid var(--linha);text-align:left;font-size:.93rem}
  th{background:var(--cartao2);font-weight:800;position:sticky;top:0}
  td.n,th.n{text-align:center}
  .nota-alta{color:var(--verde);font-weight:800}
  .nota-baixa{color:var(--coral);font-weight:800}
  .resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
  .resumo div{background:var(--n-amarelo);color:var(--tinta-nota);border-radius:12px;padding:10px 14px;font-weight:700}
  .resumo div:nth-child(2){background:var(--n-azul)}
  .resumo div:nth-child(3){background:var(--n-verde)}
  .resumo b{display:block;font-size:1.6rem;font-family:var(--f-display)}
  footer{max-width:1080px;margin:0 auto;padding:6px 16px 30px;color:var(--tinta2);font-size:.88rem;text-align:center;font-weight:600}
  footer .links-rodape a{color:var(--tinta2);font-weight:700}
  .vazio{color:var(--tinta2);padding:6px 0;font-weight:600}
  @media (max-width:560px){
    .grade-jogos{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .nota{height:78px;font-size:38px}
    .nota .tema{font-size:10.5px;left:6px;top:6px;padding:1px 7px}
    .corpo{padding:9px 10px 11px}
    .corpo h3{font-size:.95rem}
    .corpo p{font-size:.78rem}
    .marcado{width:24px;height:24px;font-size:13px;right:6px;top:6px}
    .card{padding:16px}
    .grade-ativ{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ---------- Site único: navegação, login, jogos, administração ---------- */
  /* barra de abas: uma linha, sublinhado na aba ativa, rola para o lado no celular (padrão YouTube/Play/Khan) */
  nav.abas{position:sticky;top:0;z-index:30;display:flex;gap:2px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;
    background:var(--cartao);border-bottom:1px solid var(--linha);box-shadow:0 6px 16px -14px rgba(29,43,83,.5);
    padding:0 max(12px,calc((100% - 1080px) / 2))}
  nav.abas::-webkit-scrollbar{display:none}
  nav.abas[hidden]{display:none}
  nav.abas button{flex:none;background:transparent;border:0;border-bottom:3px solid transparent;border-radius:0;box-shadow:none;
    color:var(--tinta2);font-size:.98rem;font-weight:800;padding:14px 14px 11px;gap:7px}
  nav.abas button:hover{transform:none;color:var(--tinta);background:var(--cartao2)}
  nav.abas button:active{transform:none;box-shadow:none}
  nav.abas button[aria-current="page"]{color:var(--tinta);border-bottom-color:var(--marca-borda)}
  @media(max-width:700px){nav.abas{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}nav.abas button{padding:13px 11px 10px;font-size:.93rem}}
  /* busca */
  .busca{position:relative;margin:4px 0 14px}
  .busca input{padding:12px 14px 12px 42px;border-radius:999px;border:1px solid var(--linha);background:var(--cartao2);font-weight:600}
  .busca input:focus{outline:none;border-color:var(--azul);background:var(--cartao);box-shadow:0 0 0 4px rgba(47,99,214,.15)}
  .busca::before{content:'';position:absolute;left:16px;top:50%;width:14px;height:14px;margin-top:-9px;border:2.5px solid var(--tinta2);border-radius:50%;pointer-events:none}
  .busca::after{content:'';position:absolute;left:29px;top:50%;width:7px;height:2.5px;margin-top:5px;background:var(--tinta2);transform:rotate(45deg);border-radius:2px;pointer-events:none}
  .ola{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
  /* filtros em chips planos; no celular, uma linha que rola para o lado */
  .filtros{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}
  .filtros-rot{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2);margin-right:2px;flex:none}
  .filtro{flex:none;font:inherit;font-weight:700;font-size:.9rem;padding:7px 14px;border-radius:99px;border:1px solid var(--linha);background:var(--cartao2);color:var(--tinta);box-shadow:none;cursor:pointer}
  .filtro:hover{transform:none;background:#e9eef8}
  .filtro:active{transform:none;box-shadow:none}
  .filtro[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}
  @media(max-width:700px){
    .filtros{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-20px;margin-right:-20px;padding:0 20px 2px;
      -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 88%,transparent)}
    .filtros::-webkit-scrollbar{display:none}
  }
  .secao-titulo.conteudo{font-size:1.1rem;margin-top:22px}
  .secao-titulo small{font-family:var(--f-texto,inherit);font-size:.8rem;font-weight:700;opacity:.6}
  .sugestao{border:2px solid var(--marca-borda);background:#fffbea;border-radius:16px;padding:12px 14px;margin:10px 0}
  .sugestao.lida{border-color:var(--linha);background:var(--cartao2);opacity:.85}
  .sug-topo{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
  .sug-quem{font-size:.85rem;color:var(--tinta2);margin:4px 0}
  .sug-texto{white-space:pre-wrap;margin:8px 0;line-height:1.5}
  .secao-titulo{display:flex;align-items:center;gap:10px;margin:6px 0 12px;font-family:var(--f-display);font-size:1.3rem;font-weight:600}
  .login-box{max-width:440px;margin:26px auto}
  /* ---- página de apresentação (tela inicial sem login) ---- */
  .lp-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,420px);gap:22px;align-items:start;margin-top:8px}
  .lp-hero .login-box{margin:0;max-width:none}
  .lp-hero .login-acoes{display:none!important}
  .lp-hero{align-items:stretch}
  .lp-esq{display:flex;flex-direction:column;justify-content:center}
  .lp-hero .login-box .card{margin-bottom:0;height:100%}
  .lp-esq{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--hero-bg),var(--hero-bg2));color:#fff;border-radius:22px;padding:30px 28px;box-shadow:var(--sombra)}
  .lp-esq::after{content:"🧮 📐 🎲 🔬 🚀";position:absolute;right:-6px;bottom:-8px;font-size:2.4rem;letter-spacing:8px;opacity:.16;white-space:nowrap;transform:rotate(-6deg)}

  var e = document.createElement(tag);

  Object.keys(props).forEach(function(k){

    if(k === 'class') e.className = v;
    else if(k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
    else if(k === 'value') e.value = v;

  for(var i = 2; i < arguments.length; i++){
    [].concat(arguments[i]).forEach(function(c){
      if(c === null || c === undefined || c === false) return;
      e.append(c.nodeType ? c : document.createTextNode(String(c)));

}

var SNAP_CHAVE = 'gm_snap_visitante';
function snapshotVisitante(){
  try{
    if(localStorage.getItem(SNAP_CHAVE) !== null) return;
    var o = {};
    for(var i = 0; i < localStorage.length; i++){ var k = localStorage.key(i); if(k !== SNAP_CHAVE) o[k] = localStorage.getItem(k); }
    localStorage.setItem(SNAP_CHAVE, JSON.stringify(o));
  }catch(e){}
}
function limparVisitante(){
  try{
    var s = localStorage.getItem(SNAP_CHAVE); if(s === null) return;
    var o = JSON.parse(s), atuais = [];
    for(var i = 0; i < localStorage.length; i++) atuais.push(localStorage.key(i));
    atuais.forEach(function(k){ if(k !== SNAP_CHAVE && !(k in o)) localStorage.removeItem(k); });
    Object.keys(o).forEach(function(k){ if(localStorage.getItem(k) !== o[k]) localStorage.setItem(k, o[k]); });
    localStorage.removeItem(SNAP_CHAVE);
  }catch(e){}
}

          : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : 'Navegador';

  var letras = 'abcdefghjkmnpqrstuvwxyz', nums = '23456789', a = new Uint32Array(8); crypto.getRandomValues(a);
  var s = ''; for(var i = 0; i < 5; i++) s += letras[a[i] % letras.length];
  for(i = 5; i < 8; i++) s += nums[a[i] % nums.length];
  return s.charAt(0).toUpperCase() + s.slice(1);
}

async function entrarVisitante(tok){
  var r, d = {};
  try{
    r = await fetch(FUNCOES + 'jogo', {method:'POST', headers:{'Content-Type':'application/json', 'apikey': window.SUPABASE_KEY},
      body: JSON.stringify({convite: tok, acao: 'entrar_site'})});
    d = await r.json().catch(function(){ return {}; });
  }catch(e){ desenharLogin('Sem conexão. Verifique a internet e recarregue a página.'); return true; }
  if(r.status === 410){ limparVisitante(); desenharLogin(d.mensagem || 'Seu tempo de teste acabou. Entre com seu login e senha.'); return true; }
  if(!r.ok || !d.ok){ limparVisitante(); desenharLogin('Este convite não é válido. Peça um novo link ao Prof. Haroldo.'); return true; }
  visitante = {token: tok, expira: Date.parse(d.expira_em)};

  try{ sessionStorage.setItem('gm_convite', tok); }catch(e){}
  try{ history.replaceState(null, '', location.pathname + (location.hash || '')); }catch(e){}

  atualizaTempoVisitante();
  visitanteTimer = setInterval(atualizaTempoVisitante, 1000);
  return true;
}
function atualizaTempoVisitante(){
  if(!visitante) return;
  var falta = visitante.expira - Date.now();
  if(falta <= 0){ sairVisitante('Seu tempo de teste acabou. Entre com seu login e senha.'); return; }

  var t = document.getElementById('tempo-visitante');
  if(t) t.textContent = '🧪 Teste · ' + m + ':' + (s < 10 ? '0' : '') + s;

async function iniciar(){
  var r = await sb.auth.getSession();
  sessao = r.data.session;
  sb.auth.onAuthStateChange(function(evt, s){
    if(evt === 'TOKEN_REFRESHED' || evt === 'SIGNED_IN') sessao = s;
    if(evt === 'SIGNED_OUT' && perfil){ sessao = null; perfil = null; pararVigia(); desenharLogin(); }
  });
  var pagTok = new URLSearchParams(location.search).get('pagamento');
  if(pagTok && !sessao){ desenharAcompanhar(pagTok); return; }
  if(!pegaConvite()) limparVisitante();
  if(!sessao){ var conv = pegaConvite(); if(conv && await entrarVisitante(conv)) return; desenharLogin(); if(location.hash === '#degustacao') desenharDegustacao(); return; }
  SID = ler('gm_sid_' + sessao.user.id);
  if(!SID){ await sb.auth.signOut({scope:'local'}); sessao = null; desenharLogin(); return; }
  var v = await sb.rpc('verificar_sessao', {p_sessao: SID});
  if(v.error){ app.replaceChildren(el('div', {class:'card'}, msg('erro', 'Sem conexão com o servidor. Verifique a internet e recarregue a página.'))); return; }
  if(v.data !== 'ok'){ expulsar(v.data); return; }
  var p = await sb.from('perfis').select('nome, papel, login, validade').eq('id', sessao.user.id).single();
  if(p.error || !p.data){ expulsar('sem_perfil'); return; }
  perfil = p.data;
  entrarNoSite();
}

    var txt = el('div', {class:'txt'});

      var cab;
      if(it.jogo && window.JOGOS && window.JOGOS[it.jogo]){
        cab = el('button', {class:'nov-jogo', type:'button', title:'Abrir ' + window.JOGOS[it.jogo].nome}, rotulo);

      } else cab = el('b', {}, rotulo);
      txt.replaceChildren(cab, el('span', {}, it.texto));
    }
    function agenda(){
      clearInterval(timer);
      if(!pausado && !reduzir && itens.length > 1) timer = setInterval(function(){ i = (i + 1) % itens.length; mostra(); }, 6000);
    }
    btnProx.addEventListener('click', function(){ i = (i + 1) % itens.length; mostra(); agenda(); });
    btnFechar.addEventListener('click', function(){
      clearInterval(timer);
      try{ localStorage.setItem('faixaNov-visto', assinatura); }catch(e){}
      faixa.remove();
    });
    btnPausa.addEventListener('click', function(){
      pausado = !pausado;

  var h = window.innerHeight * 0.85, mapa = {ArrowDown: 80, ArrowUp: -80, PageDown: h, PageUp: -h};

/* ---------- notas e relatórios ---------- */
function consolidar(brutos){
  var porAluno = {};
  brutos.forEach(function(r){
    var k = chaveAluno(r);
    var g = porAluno[k] || (porAluno[k] = {nome: r.aluno_nome, turma: r.aluno_turma || '', tentativas: 0, escolhido: null});
    g.tentativas++;
    var c = g.escolhido;
    if(modo === 'ultima'){
      if(!c || r.enviado_em >= c.enviado_em) g.escolhido = r;
    } else {
      if(!c || Number(r.nota) > Number(c.nota) || (Number(r.nota) === Number(c.nota) && r.pontos > c.pontos)) g.escolhido = r;
    }
  });
  return Object.keys(porAluno).map(function(k){ return porAluno[k]; })
    .sort(function(a, b){
      var ea = a.escolhido, eb = b.escolhido;
      /* maior nota primeiro; em caso de empate, fica na frente quem terminou (enviou) primeiro */
      return (Number(eb.nota) - Number(ea.nota)) || (Date.parse(ea.enviado_em) - Date.parse(eb.enviado_em)) || a.nome.localeCompare(b.nome, 'pt-BR');
    });
}

var timerNotas = null, autoNotas = true, ultimaAtualizacao = null;
async function mostrarResultados(id, rolar, silencioso){
  var area = document.getElementById('area-resultados');
  var a = atividades.find(function(x){ return x.id === id; });
  if(!a){ area.replaceChildren(); return; }
  if(!silencioso) area.replaceChildren(el('div', {class:'card'}, 'Carregando resultados…'));
  var r = await sb.from('resultados').select('*').eq('atividade_id', id).order('enviado_em', {ascending:true}).limit(5000);
  if(r.error){ area.replaceChildren(el('div', {class:'card'}, msg('erro', 'Erro ao carregar: ' + r.error.message))); return; }
  resultadosBrutos = r.data;
  ultimaAtualizacao = new Date();
  desenharResultados(a);
  if(rolar) area.scrollIntoView({behavior:'smooth', block:'start'});
}

function agendarAtualizacaoNotas(a){
  clearInterval(timerNotas); timerNotas = null;
  if(!autoNotas) return;
  timerNotas = setInterval(function(){
    if(!document.getElementById('area-resultados') || aba !== 'turmas' || abertaId !== a.id || document.hidden){
      if(!document.getElementById('area-resultados') || aba !== 'turmas' || abertaId !== a.id){ clearInterval(timerNotas); timerNotas = null; }
      return;
    }
    mostrarResultados(a.id, false, true);
  }, 15000);
}

        'Atualizar sozinho a cada 15 s'),
      el('small', {class:'vazio', style:'margin:0'}, 'Ordem: da maior para a menor nota' + (ultimaAtualizacao ? ' · atualizado às ' + ultimaAtualizacao.toLocaleTimeString('pt-BR') : ''))),

/* ---------- exportações ---------- */
function baixarCsv(a, linhas){
  function cel(v){
    var t = String(v === null || v === undefined ? '' : v);
    if(/^[=+\-@\t\r]/.test(t)) t = "'" + t;   // evita que o Excel trate o texto como fórmula
    return '"' + t.replace(/"/g, '""') + '"';
  }
  var rows = [['Nº','Aluno','Turma','Acertos','Total de questões','Nota','Tentativas','Tempo','Enviado em']];
  linhas.forEach(function(l, i){
    var e = l.escolhido;
    rows.push([i + 1, l.nome, l.turma, e.acertos, e.total_questoes, fmtNota(e.nota), l.tentativas, fmtTempo(e.tempo_segundos), fmtData(e.enviado_em)]);
  });
  var csv = '﻿' + rows.map(function(r){ return r.map(cel).join(';'); }).join('\r\n');
  baixar(new Blob([csv], {type:'text/csv;charset=utf-8'}), 'resultados-' + slug(a.titulo) + '.csv');
}

/* A biblioteca do Word é grande: só é baixada quando alguém pede o relatório (deixa a tela de entrada mais leve). */
function carregarDocx(){
  if(window.docx) return Promise.resolve();
  return new Promise(function(ok, falha){
    var t = document.createElement('script');
    t.src = 'https://cdn.jsdelivr.net/npm/docx@9.8.1/dist/index.iife.js';
    t.onload = ok; t.onerror = falha; document.head.appendChild(t);
  });
}
async function baixarWord(a, linhas, media){
  try{ await carregarDocx(); }catch(e){}
  if(!window.docx){ window.alert('A biblioteca do Word não carregou. Verifique a internet e tente de novo.'); return; }
  var D = window.docx;
  var nomeProf = (sessao.user.user_metadata && sessao.user.user_metadata.nome) || sessao.user.email;
  var larguras = [600, 3500, 1300, 1300, 1100, 1838];   // soma = 9638 (A4 com margens de 2 cm)
  var borda = {style: D.BorderStyle.SINGLE, size: 4, color: 'B8C0D9'};
  var bordas = {top:borda, bottom:borda, left:borda, right:borda};

  function celula(texto, i, opt){
    opt = opt || {};
    return new D.TableCell({
      width: {size: larguras[i], type: D.WidthType.DXA},
      borders: bordas,
      shading: opt.cabecalho ? {fill:'E3E7FA', type: D.ShadingType.CLEAR, color:'auto'} : undefined,
      margins: {top: 70, bottom: 70, left: 100, right: 100},
      children: [new D.Paragraph({
        alignment: opt.centro ? D.AlignmentType.CENTER : D.AlignmentType.LEFT,
        children: [new D.TextRun({text: String(texto), bold: !!opt.cabecalho || !!opt.negrito, size: 22, font: 'Arial'})]
      })]
    });
  }
  function par(rotulo, valor){
    return new D.Paragraph({spacing:{after:60}, children:[
      new D.TextRun({text: rotulo + ': ', bold:true, size:23, font:'Arial'}),
      new D.TextRun({text: String(valor), size:23, font:'Arial'})]});
  }

  var cab = new D.TableRow({tableHeader:true, children:[
    celula('Nº',0,{cabecalho:true,centro:true}), celula('Aluno',1,{cabecalho:true}), celula('Turma',2,{cabecalho:true}),
    celula('Acertos',3,{cabecalho:true,centro:true}), celula('Nota',4,{cabecalho:true,centro:true}), celula('Tentativas',5,{cabecalho:true,centro:true})]});
  var corpo = linhas.map(function(l, i){
    var e = l.escolhido;
    return new D.TableRow({cantSplit:true, children:[
      celula(i+1,0,{centro:true}), celula(l.nome,1), celula(l.turma || '—',2),
      celula(e.acertos + '/' + e.total_questoes,3,{centro:true}), celula(fmtNota(e.nota),4,{centro:true,negrito:true}),
      celula(l.tentativas,5,{centro:true})]});
  });

  var doc = new D.Document({
    creator: nomeProf, title: 'Relatório – ' + a.titulo,
    sections: [{
      properties: {page: {size: {width: 11906, height: 16838}, margin: {top:1134, bottom:1134, left:1134, right:1134}}},
      children: [
        new D.Paragraph({alignment: D.AlignmentType.CENTER, spacing:{after:80}, children:[
          new D.TextRun({text:'Relatório da Atividade', bold:true, size:36, font:'Arial'})]}),
        new D.Paragraph({alignment: D.AlignmentType.CENTER, spacing:{after:240}, children:[
          new D.TextRun({text: a.titulo, size:28, font:'Arial', color:'4F46E5'})]}),
        par('Jogo', (window.JOGOS[a.jogo] ? window.JOGOS[a.jogo].nome : a.jogo)),
        par('Turma', a.turma || '—'),
        par('Professor(a)', nomeProf),
        par('Gerado em', new Date().toLocaleString('pt-BR', {dateStyle:'long', timeStyle:'short'})),
        par('Critério da nota', modo === 'ultima' ? 'última tentativa de cada aluno' : 'melhor tentativa de cada aluno'),
        par('Alunos que participaram', linhas.length),
        par('Média da turma', fmtNota(media)),
        new D.Paragraph({spacing:{before:200, after:120}, children:[]}),
        new D.Table({width:{size:9638, type:D.WidthType.DXA}, columnWidths: larguras, rows:[cab].concat(corpo)}),
        new D.Paragraph({spacing:{before:200}, children:[
          new D.TextRun({text:'Nota de 0 a 10 = acertos ÷ total de questões × 10. Gerado pelo portal Gamifica Educação.', italics:true, size:18, font:'Arial', color:'5D6785'})]})
      ]
    }]
  });
  var blob = await D.Packer.toBlob(doc);
  baixar(blob, 'relatorio-' + slug(a.titulo) + '.docx');
}

function situacao(c){
  if(!c.ativo) return {t:'⛔ Bloqueada', cls:'enc'};
  if(c.validade && c.validade < hojeISO()) return {t:'⏰ Vencida', cls:'venc'};
  return {t:'● Ativa', cls:'aberta'};
}
/* Abre o WhatsApp com o texto pronto (sem número: escolhe o contato na hora). */
function linkWhatsApp(texto){ return 'https://wa.me/?text=' + encodeURIComponent(texto); }
/* Link de acesso: leva o login e a senha no trecho depois do # (que não vai para o servidor).
   Ao abrir, a tela de entrada vem preenchida e o endereço é limpo. */
function linkDeAcesso(login, senha){
  var b = btoa(unescape(encodeURIComponent(login + '\n' + senha))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return location.origin + location.pathname.replace(/[^/]*$/, '') + '#acesso=' + b;
}
window.addEventListener('hashchange', function(){ if(!sessao && lerAcessoDoLink()) desenharLogin(); });
function lerAcessoDoLink(){
  var m = (location.hash || '').match(/^#acesso=([A-Za-z0-9_-]+)$/);
  if(!m) return null;
  try{
    var t = decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/'))));
    var i = t.indexOf('\n'); if(i < 1) return null;
    return {login: t.slice(0, i), senha: t.slice(i + 1)};
  }catch(e){ return null; }
}
function mostrarQR(url, titulo, explica){
  var cv;
  try{ cv = window.QRMini.canvas(url, 520); }
  catch(e){ window.alert('Login e senha muito longos para virar QR Code. Use o link de acesso ou escolha dados mais curtos.'); return; }
  var img = cv.toDataURL('image/png');
  var fundo = el('div', {class:'ma-fundo', role:'dialog', 'aria-modal':'true', 'aria-label':titulo, onclick: function(ev){ if(ev.target === fundo) fechar(); }});
  var fechar = function(){ fundo.remove(); document.removeEventListener('keydown', esc); };
  var esc = function(ev){ if(ev.key === 'Escape') fechar(); };
  document.addEventListener('keydown', esc);
  fundo.append(el('div', {class:'ma-caixa'},
    el('h2', {}, titulo), el('p', {class:'sub2'}, explica || ''),
    el('img', {src: img, alt:'QR Code de acesso', style:'width:100%;max-width:300px;display:block;margin:12px auto;background:#fff;padding:10px;border-radius:12px'}),

      c.observacao ? el('span', {}, '📝 ' + c.observacao) : null,
      el('span', {}, '💰 ' + (c.valor_pago != null ? 'R$ ' + Number(c.valor_pago).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : 'valor não informado'))),
    (c.trocas_30d >= 3 || c.aparelhos_30d >= 4) ? el('div', {class:'alerta'},
      '⚠️ Possível compartilhamento: ' + c.trocas_30d + ' desconexões por login em outro aparelho e ' + c.aparelhos_30d + ' aparelhos diferentes nos últimos 30 dias.') : null,
    el('div', {class:'linha'}, botoes), extra);
}

try{ var nApps = Object.keys(window.JOGOS).filter(function(k){ return k !== 'demo-porcentagem'; }).length, tA = document.getElementById('totalApps'); if(tA) tA.textContent = nApps; }catch(e){}
iniciar();
})();
</script>
